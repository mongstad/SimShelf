[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simshelf"
version = "0.1.0"
description = "A local simulation library and run journal for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "packaging>=24,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "build>=1,<2"]

[project.scripts]
simshelf = "simshelf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simshelf = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

